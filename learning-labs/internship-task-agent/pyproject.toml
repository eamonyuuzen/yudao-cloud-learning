[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-task-agent"
version = "0.1.0"
description = "A minimal read-only Agent lab that reuses Yudao internship-task APIs."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  # 2.49.0+ requires a token-detail field that agents 0.16.1 does not supply.
  "openai==2.40.0",
  "openai-agents>=0.16,<0.17",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
